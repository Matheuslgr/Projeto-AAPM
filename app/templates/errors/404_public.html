<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada — AAPM</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/404public.css">
</head>
<body>

    <!-- Efeitos de fundo -->
    <div class="bg-particles" aria-hidden="true">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>
    <div class="diamond diamond--1" aria-hidden="true"></div>
    <div class="diamond diamond--2" aria-hidden="true"></div>
    <div class="diamond diamond--3" aria-hidden="true"></div>

    <div class="error-container">

        <div class="error-logo">
            <img src="/static/images/logo-aapm.png?v=2" alt="AAPM - Escola SENAI Francisco Matarazzo">
        </div>

        <div class="error-code">404</div>

        <h1 class="error-title">Página não encontrada</h1>
        <p class="error-desc">
            O endereço que você tentou acessar não existe ou foi removido.
        </p>

        <div class="error-card">
            <p>Verifique se digitou o endereço corretamente ou volte para a tela de login.</p>
            <div class="error-actions">
                <a href="/auth/login" class="btn-primary">
                    Ir para o Login
                </a>
            </div>
        </div>

    </div>

</body>
</html>
